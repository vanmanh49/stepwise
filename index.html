<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Watch data structures, algorithms, SQL, microservices, Kubernetes, AI, security, networking and design patterns run one step at a time, on your own input." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Stepwise — Learn How Software Works, Step by Step</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // Anything but a saved 'light' or 'dark' follows the system, as in src/store/theme.ts.
      var t = null;
      try {
        t = localStorage.getItem('dsa-theme');
      } catch (e) {}
      if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
